apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: cubesense-backendconfig
  namespace: clickspikes
spec:
  healthCheck:
    checkIntervalSec: 30
    healthyThreshold: 1
    port: 3000
    requestPath: /healthz
    timeoutSec: 10
    type: HTTP
    unhealthyThreshold: 3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cubesense
  namespace: clickspikes
  labels:
    app: cubesense
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cubesense
  template:
    metadata:
      labels:
        app: cubesense
    spec:
      containers:
        - name: cubesense
          image: us-central1-docker.pkg.dev/applied-abbey-356818/clickspikes/cubesense:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet: { path: /healthz, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 3000 }
            initialDelaySeconds: 20
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: cubesense-service
  namespace: clickspikes
  annotations:
    cloud.google.com/backend-config: '{"default":"cubesense-backendconfig"}'
spec:
  type: NodePort
  selector:
    app: cubesense
  ports:
    - port: 3000
      targetPort: 3000
